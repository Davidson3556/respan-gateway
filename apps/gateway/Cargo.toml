[package]
name = "respan-gateway"
description = "An LLM gateway with a neutral core and compiled-in plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-conversation.workspace = true
respan-gateway-sdk.workspace = true
respan-gateway-http = { workspace = true, features = ["reqwest"] }
respan-gateway-anthropic.workspace = true
respan-gateway-openai.workspace = true
respan-gateway-plugins.workspace = true
respan-gateway-axum = { workspace = true, features = ["ws"] }
respan-gateway-realtime.workspace = true
respan-gateway-ws.workspace = true
axum.workspace = true
serde.workspace = true
serde_norway.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
futures.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
