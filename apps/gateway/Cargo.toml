[package]
name = "respan-gateway"
description = "An LLM gateway with a neutral core and compiled-in plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "respan_gateway"
path = "src/lib.rs"

[[bin]]
name = "respan-gateway"
path = "src/main.rs"

[dependencies]
base64.workspace = true
form_urlencoded.workspace = true
respan-gateway-http-faults.workspace = true
respan-gateway-plugin-relay.workspace = true
respan-gateway-plugin-credentials.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
respan-gateway-mcp.workspace = true
respan-gateway-mcp-http.workspace = true
respan-gateway-passthrough-http.workspace = true
respan-gateway-media.workspace = true
respan-gateway-media-http.workspace = true
respan-gateway-plugin-fallback.workspace = true
respan-gateway-plugin-routing.workspace = true
respan-gateway-plugin-tool-loop.workspace = true
respan-gateway-plugin-mcp-aggregate.workspace = true
respan-gateway-providers.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
respan-gateway-ws.workspace = true
respan-gateway-serve.workspace = true
axum.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
getrandom = { workspace = true, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
percent-encoding.workspace = true
futures.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
