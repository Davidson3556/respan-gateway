<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Respan Gateway</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6470;
    --border: #e3e6eb; --ok: #12805c; --ok-soft: #e3f4ec; --bad: #c4361f; --bad-soft: #fbe7e3;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114; --card: #181b20; --text: #e8eaee; --muted: #9aa1ad;
      --border: #2a2f37; --ok: #3ccf91; --ok-soft: #133327; --bad: #ff7a63; --bad-soft: #3a1c17;
      --code: #22262d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  main {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px;
    text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  .mark {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .ok .mark { background: var(--ok-soft); color: var(--ok); }
  .bad .mark { background: var(--bad-soft); color: var(--bad); }
  .mark svg { width: 28px; height: 28px; }
  .ok .cross, .bad .check { display: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
  code {
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code); padding: 2px 6px; border-radius: 5px; color: var(--text);
    overflow-wrap: anywhere;
  }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main class="{{tone}}">
  <div class="mark" aria-hidden="true">
    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <svg class="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
  <h1>{{title}}</h1>
  <p>{{detail}}</p>
  <footer>Respan Gateway · MCP login</footer>
</main>
</body>
</html>
