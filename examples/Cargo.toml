[package]
name = "respan-gateway-examples"
description = "Runnable examples: how to build the use cases on the public core and protocol APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
respan-gateway-providers.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-plugins.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
reqwest.workspace = true
respan-gateway-http = { workspace = true, features = ["reqwest"] }
respan-gateway-mcp.workspace = true
respan-gateway-mcp-http.workspace = true
respan-gateway-ws.workspace = true
respan-gateway-serve.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
async-trait.workspace = true
base64 = "0.22"
axum = { workspace = true, features = ["ws"] }
bytes.workspace = true
futures.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

