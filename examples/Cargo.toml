[package]
name = "respan-gateway-examples"
description = "Runnable examples: how to build the use cases on the public core and protocol APIs."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
uuid.workspace = true
parking_lot.workspace = true
respan-gateway-http-faults.workspace = true
respan-gateway-passthrough-http.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
respan-gateway-vendors.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-media.workspace = true
respan-gateway-media-http.workspace = true
respan-gateway-plugin-fallback.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
respan-gateway-plugin-relay = { path = "../crates/plugins/relay" }
respan-gateway-plugin-routing = { path = "../crates/plugins/routing" }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
reqwest.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport = { path = "../crates/wires/http-transport" }
respan-gateway-mcp = { path = "../crates/kinds/mcp" }
respan-gateway-mcp-http = { path = "../crates/formats/mcp-http" }
respan-gateway-ws = { path = "../crates/wires/ws" }
respan-gateway-serve = { path = "../crates/serve" }
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "26cf441" }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
async-trait.workspace = true
base64 = "0.22"
axum = { workspace = true, features = ["ws"] }
bytes.workspace = true
futures.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = "0.1"

