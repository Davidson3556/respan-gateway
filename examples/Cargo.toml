[package]
name = "respan-gateway-examples"
description = "Runnable examples: how to build the use cases on the core and the SDKs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# tests/<name>.rs are the examples' own tests, included by each example.
autotests = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-formats.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
reqwest.workspace = true
respan-gateway-plugins.workspace = true
respan-gateway-server.workspace = true
respan-gateway-testkit.workspace = true
respan-gateway-routing.workspace = true
respan-gateway-text.workspace = true
respan-gateway-ledger.workspace = true
respan-gateway-mcp.workspace = true
respan-gateway-ws.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
async-trait.workspace = true
base64 = "0.22"
axum.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[example]]
name = "billing"
path = "billing.rs"
test = true

