[package]
name = "respan-gateway-ws"
description = "WebSocket outbound transport and JSON events format for gateway sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-sdk.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
