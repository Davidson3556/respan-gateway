[package]
name = "respan-gateway-routing"
description = "An adversarial routing SDK written against the respan-gateway core's public API only."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the root workspace.
[workspace]

[dependencies]
respan-gateway-core = { path = "../../crates/core" }
respan-gateway-formats = { path = "../../crates/formats" }
respan-gateway-server = { path = "../../crates/server" }
tokio = { version = "1", features = ["time", "rt", "macros", "sync"] }
base64 = "0.22"

[dev-dependencies]
respan-gateway-testkit = { path = "../../crates/testkit" }
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
