[package]
name = "respan-money"
description = "Budgets and billing for respan-gateway, written against the public core API only. Its real purpose is adversarial: see FINDINGS.md."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the gateway's workspace.
[workspace]

[dependencies]
respan-gateway-core = { path = "../../crates/core" }
respan-gateway-formats = { path = "../../crates/formats" }

[dev-dependencies]
respan-gateway-server = { path = "../../crates/server" }
respan-gateway-testkit = { path = "../../crates/testkit" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
