[package]
name = "respan-gateway-ws"
description = "WebSocket sessions on the gateway: an outbound transport, an axum adapter, and a JSON events format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-formats.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
respan-gateway-testkit.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "sync", "test-util"] }
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
