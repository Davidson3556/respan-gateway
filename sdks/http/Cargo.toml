[package]
name = "respan-gateway-http"
description = "HTTP at the gateway's edges: the adapter's and transports' rules, credentials, and helpers for HTTP formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
reqwest = ["dep:reqwest"]

[dependencies]
respan-gateway-core.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"] }
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true

[dev-dependencies]
respan-gateway-providers.workspace = true
respan-gateway-formats.workspace = true
respan-gateway-messages.workspace = true
respan-gateway-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
