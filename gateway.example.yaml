# Every setting of respan-gateway, with what it does. `respan-gateway init`
# writes a shorter starter; with no config file at all, the gateway makes a
# provider of each vendor whose key is in the environment.

# Without client keys (below), anyone who can reach this address spends
# your keys, so the gateway REFUSES TO START on a non-loopback address
# (0.0.0.0, a LAN IP) without them; set `client_keys` first
# (`respan-gateway init --client-key` writes one). Without keys it also
# refuses browsers' cross-origin requests and any Host but localhost,
# 127.0.0.1, [::1], this address or respan-gateway. host:port (a name is
# resolved), :port or a bare port (on 127.0.0.1). `--listen`, RESPAN_LISTEN
# and then the PORT variable (on 0.0.0.0) override this.
listen: 127.0.0.1:8080

# Client keys, literal or env:NAME. When set, every request needs one, as
# `Authorization: Bearer <key>`, `x-api-key` or `x-goog-api-key`; the
# gateway takes it off, and no provider sees it. The web UI asks for one too.
# RESPAN_CLIENT_KEYS (comma separated) adds more from the environment.
# client_keys: [env:GATEWAY_KEY]

# How each finished request is printed to stderr, with a timestamp and a
# level: text (the default), json (a line each) or off. `--log` and
# RESPAN_LOG say it from outside. `ui: false` turns off the web UI and its
# admin API at /ui/ (`/` redirects there).
# log: text
# ui: true

# The most bytes of a client's request, and of a provider's answer held at
# once: past it, the request fails 413, the answer 502. A number of bytes
# or a size such as 32MiB. 32 MiB if unset, the largest request the
# vendors' JSON APIs take.
# body_limit: 32MiB

# The file is read once at start: change it, restart. (No hot reload.)
#
# Providers, by name, in order: the first serving a kind (chat, realtime,
# image, transcription, speech, embedding, video, ...) is that kind's default. A vendor
# preset brings the vendor's base URL, its key from env:<VENDOR>_API_KEY,
# every format of the vendor this binary speaks (OpenAI: chat, Responses
# over HTTP (openai-responses) and WebSocket, realtime, images,
# transcriptions, speech, videos and embeddings; Gemini: chat through its
# OpenAI-compatible endpoint, generateContent (gemini-generate), Live,
# Imagen as openai-images, Veo as gemini-veo and embeddings; Groq: chat, transcriptions and speech; xAI: chat and
# images; Together: chat, images and embeddings; Mistral, Fireworks and
# Ollama: chat and embeddings), and
# its model names: gpt-*, o3-*, dall-e*, whisper-1, tts-*, sora* ... go to
# openai, claude-* to anthropic, gemini-*, imagen-*, veo-* to gemini,
# whisper-large-* to groq, without a route of your own. A name routes only
# among the providers serving the request's kind. Presets:
# openai, anthropic, gemini, groq, deepseek, openrouter, xai, mistral,
# together, fireworks, ollama, azure and vllm (these two need a `base_url`).
# Override `base_url` or `key` in place.
# Any provider is also reached as `<name>/<model>`, as in
# `groq/llama-3.3-70b-versatile`; the gateway sends `llama-3.3-70b-versatile`.
# A name before `/` that is no provider's is part of the model, as
# Together's `meta-llama/...` (to together), Fireworks' `accounts/...` (to
# fireworks) and OpenRouter's `anthropic/...` (to openrouter, unless a
# provider is named `anthropic`). Of two preset prefixes, the longer wins.
# Names are letters, digits, `_`, `.` and `-`. With this file,
# RESPAN_<VENDOR>_BASE_URL is not read: set `base_url`.
providers:
  openai: { vendor: openai }
  anthropic: { vendor: anthropic }
#   gemini: { vendor: gemini }        # GEMINI_API_KEY or GOOGLE_API_KEY
#   groq: { vendor: groq }
#   local: { vendor: ollama, base_url: http://localhost:11434/v1 }

# A provider spelled out: its format (or a list of them), the base URL its
# own SDK takes (OpenAI's holds the version, Anthropic's does not) and its
# key, sent as each format expects (Bearer; x-api-key for
# anthropic-messages; x-goog-api-key for gemini-generate, gemini-live and gemini-veo), or any
# one header with `auth`. A vendor's quirks, such as Groq's usage under
# `x_groq` or vLLM's `reasoning_content`, come with `vendor:`; a provider of
# a format alone has none. A provider with no key (no `key`, no `auth`, and
# no preset key in the environment) passes on the client's own credential
# headers, but only when the client speaks that provider's format; no key
# crosses a translation. A provider with a key always uses its own.
#   compatible:
#     formats: openai-chat
#     base_url: https://llm.example.com/v1
#     auth: { type: bearer, key: env:COMPATIBLE_KEY }
#   responses:                   # OpenAI Responses over HTTP: a chat format
#     formats: openai-responses  # other chat providers are translated to and from
#     base_url: https://api.openai.com/v1
#     key: env:OPENAI_API_KEY
#   google:                      # Gemini's own API (generateContent and
#     formats: gemini-generate   # streamGenerateContent, the model in the path)
#     base_url: https://generativelanguage.googleapis.com/v1beta
#     key: env:GEMINI_API_KEY    # sent as x-goog-api-key
#   vllm:
#     vendor: vllm
#     base_url: http://gpu-box:8000/v1
#     key: env:VLLM_KEY

# Media: each operation is a kind of its own, and translates within it.
# OpenAI's endpoints are formats as OpenAI and compatible vendors serve them
# (base URL with the version): openai-images (/v1/images/generations and
# edits), openai-transcriptions (/v1/audio/transcriptions and
# translations), openai-speech (/v1/audio/speech), openai-embeddings
# (/v1/embeddings) and openai-videos (/v1/videos and its jobs). Google's Veo, gemini-veo, is a provider only,
# at the Gemini API's base with the version, answering OpenAI Videos
# clients; a job's follow-ups go to the provider that made it, by its id.
# When two providers speak one video format, the gateway gives clients ids
# naming the provider, `<provider>~<id>`.
#   images:
#     formats: openai-images
#     base_url: https://api.together.xyz/v1
#     key: env:TOGETHER_API_KEY
#   asr:
#     formats: [openai-transcriptions, openai-speech]
#     base_url: https://api.groq.com/openai/v1
#     key: env:GROQ_API_KEY
#   veo:
#     formats: gemini-veo
#     base_url: https://generativelanguage.googleapis.com/v1beta
#     key: env:GEMINI_API_KEY      # sent as x-goog-api-key

# Sessions over WebSocket, as their SDKs reach them: openai-realtime
# (clients at .../v1/realtime), responses-ws (an upgrade to .../v1/responses)
# and gemini-live. Each WebSocket upgrade is a session. A realtime session
# (openai-realtime or gemini-live) goes to the provider of the model in its
# URL's `?model=` and is translated if that provider speaks the other API;
# a responses-ws session goes to the one provider of its format. The openai
# and gemini presets include theirs. body_limit is HTTP's; a session's
# messages are limited by ws_message_limit.
#   realtime:
#     formats: openai-realtime
#     base_url: wss://api.openai.com/v1
#     auth: { type: bearer, key: env:OPENAI_API_KEY }
#   live:
#     formats: gemini-live
#     base_url: wss://generativelanguage.googleapis.com
#     auth: { type: header, name: x-goog-api-key, key: env:GEMINI_API_KEY }

# To relay a vendor's other endpoints too (Anthropic's count_tokens, OpenAI's
# GET /v1/responses/{id}), add a provider of format `passthrough` at the
# vendor's origin (no /v1) and serve `passthrough` last: it takes every
# request no format before it accepts, unread, byte for byte:
#   providers:
#     anthropic-any: { formats: passthrough, base_url: https://api.anthropic.com }
#   formats: [openai-chat, anthropic-messages, passthrough]
# With no config file at all: `respan-gateway proxy --anthropic` (or
# `--openai`), which does exactly that for one vendor, with each client's
# own credentials.
#
# The formats clients speak, tried in order; each recognises its own
# requests: openai-chat a POST to .../chat/completions, anthropic-messages a
# POST to .../v1/messages, openai-responses a POST to .../responses,
# gemini-generate a POST to .../models/{model}:generateContent or
# :streamGenerateContent. Anything else is a 404. Unset: all four chat
# formats, the OpenAI format of each media kind some provider speaks,
# and every session format some provider speaks.
# formats: [openai-chat, anthropic-messages, openai-responses, gemini-generate]

# Compiled-in plugins, run on every request in the order listed; a plugin
# is the one field that configures it. `models` routes model names to
# providers, before the presets' own names, for every kind the provider
# serves (a `whisper-` prefix to a transcription provider, say); a later
# plugin's match wins.
# plugins:
#   - models:
#       - { prefix: llama, provider: groq }

# The default provider of each kind it serves, for requests nothing else
# routes; unset, the first provider serving the kind.
# default: openai

# Limits. request_log is how many finished requests the in-memory request
# log (the web UI's) keeps; shutdown_grace is how long open responses and end
# hooks get, together, after a stop signal before they are cut (seconds, or
# 30s, 2m, 500ms); ws_message_limit is the largest WebSocket message of a
# session, from either side, as a size like body_limit.
# request_log: 1000
# shutdown_grace: 30s
# ws_message_limit: 16MiB

# Reloading: SIGHUP, `POST /ui/api/reload` (with a client key if keys are set)
# and `respan-gateway --watch` (on a change of this file) read this file again
# and swap the new config in for new requests; requests and sessions already
# open finish on the old one, and the request log carries over. An invalid
# file is refused and the old config keeps serving. A new `listen` needs a
# restart.

# MCP servers, each served to MCP clients over streamable HTTP at
# /mcp/{name}, behind the client keys. Name `mcp` in `formats` if you list
# them. An HTTP server's key stays on the gateway (`key`, sent as a Bearer
# token, or `auth` for another header); a client's own credentials go on
# only with `forward_auth: true`. A stdio server is a child process per
# client session, started at its `initialize` and stopped with the session
# (DELETE, 10 idle minutes, a crash, or the gateway stopping); it gets only
# PATH and its `env`, whose values are literal or env:NAME.
# mcp:
#   github: { url: "https://api.githubcopilot.com/mcp/", key: env:GITHUB_TOKEN }
#   files:
#     command: [npx, -y, "@modelcontextprotocol/server-filesystem", /data]
#     env: { LOG_LEVEL: info }
#     cwd: /data
# At most 32 MCP sessions per server.
