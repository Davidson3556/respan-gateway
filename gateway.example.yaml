# There is no client auth: anyone who can reach this address spends your
# keys. Keep it local.
listen: 127.0.0.1:8080

# A base URL is what the provider's own SDK takes: OpenAI's holds the
# version (https://api.groq.com/openai/v1 for Groq), Anthropic's does not.
# A provider with `auth` (any header) sends only its own credentials;
# without it, clients' pass through.
providers:
  openai:
    format: openai-chat
    base_url: https://api.openai.com/v1
    auth: { type: bearer, key: env:OPENAI_API_KEY }
  anthropic:
    format: anthropic-messages
    base_url: https://api.anthropic.com
    auth: { type: header, name: x-api-key, key: env:ANTHROPIC_API_KEY }

# To relay a vendor's other endpoints too (Anthropic's count_tokens, OpenAI's
# /v1/responses for Codex), add a provider of format `passthrough` at the
# vendor's origin (no /v1) and serve `passthrough` last: it takes every
# request no format before it accepts, unread, byte for byte, with the
# client's own credentials:
#   providers:
#     anthropic-any: { format: passthrough, base_url: https://api.anthropic.com }
#   serve: [openai-chat, anthropic-messages, passthrough]
# With no config file at all: `respan-gateway proxy --anthropic` (or
# `--openai`), which does exactly that for one vendor.
#
# The formats clients speak, tried in order; each recognises its own
# requests: openai-chat a POST to .../chat/completions, anthropic-messages a
# POST to .../v1/messages. Anything else is a 404.
serve: [openai-chat, anthropic-messages]

# Compiled-in plugins, run on every request in the order listed, except
# that an entry runs after the plugins its `after` names.
plugins:
  # Claude models go to Anthropic: relayed for Anthropic clients (with
  # anthropic-beta), translated for OpenAI ones.
  - name: models
    models:
      - { prefix: claude, provider: anthropic }

# The provider for requests no plugin targets. Translation is text only: a
# request with tools is refused unless it goes to a provider of its own
# format.
target: openai
