[workspace]
members = ["crates/*", "apps/gateway", "examples"]
exclude = ["validation"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-mcp-messages = { path = "crates/mcp-messages" }
respan-gateway-realtime = { path = "crates/realtime" }
respan-gateway-core = { path = "crates/core" }
respan-gateway-conversation = { path = "crates/conversation" }
respan-gateway-sdk = { path = "crates/sdk" }
respan-gateway-http = { path = "crates/http" }
respan-gateway-plugins = { path = "crates/plugins" }
respan-gateway-axum = { path = "crates/axum" }
respan-gateway-codec = { path = "crates/codec" }
respan-gateway-openai = { path = "crates/openai" }
respan-gateway-anthropic = { path = "crates/anthropic" }
respan-gateway-mcp = { path = "crates/mcp" }
respan-gateway-ws = { path = "crates/ws" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
base64 = "0.22"
futures = "0.3"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
