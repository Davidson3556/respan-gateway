[workspace]
members = ["core", "sdk", "http", "mcp", "ws", "plugins", "providers", "adapters/*", "gateway", "examples"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-core = { path = "core" }
respan-gateway-sdk = { path = "sdk" }
respan-gateway-http = { path = "http" }
respan-gateway-plugins = { path = "plugins" }
respan-gateway-axum = { path = "adapters/axum" }
respan-gateway-providers = { path = "providers" }
respan-gateway-mcp = { path = "mcp" }
respan-gateway-ws = { path = "ws" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
