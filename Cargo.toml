[workspace]
members = [
    "crates/core",
    "crates/plugins/*",
    "crates/kinds/*",
    "crates/wires/*",
    "crates/formats/*",
    "crates/vendor-kit",
    "crates/vendors",
    "crates/serve",
    "apps/gateway",
    "python",
    "examples",
]
exclude = ["validation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-realtime = { path = "crates/kinds/realtime" }
respan-gateway-core = { path = "crates/core" }
respan-gateway-conversation = { path = "crates/kinds/conversation" }
respan-gateway-media = { path = "crates/kinds/media" }
respan-gateway-http = { path = "crates/wires/http" }
respan-gateway-http-faults = { path = "crates/wires/http-faults" }
respan-gateway-http-transport = { path = "crates/wires/http-transport" }
respan-gateway-plugin-relay = { path = "crates/plugins/relay" }
respan-gateway-plugin-credentials = { path = "crates/plugins/credentials" }
respan-gateway-sse = { path = "crates/wires/sse" }
respan-gateway-plugin-routing = { path = "crates/plugins/routing" }
respan-gateway-plugin-fallback = { path = "crates/plugins/fallback" }
respan-gateway-plugin-tool-loop = { path = "crates/plugins/tool-loop" }
respan-gateway-plugin-mcp-aggregate = { path = "crates/plugins/mcp-aggregate" }
respan-gateway-mcp = { path = "crates/kinds/mcp" }
respan-gateway-ws = { path = "crates/wires/ws" }
respan-gateway-conversation-http = { path = "crates/formats/conversation-http" }
respan-gateway-media-http = { path = "crates/formats/media-http" }
respan-gateway-realtime-ws = { path = "crates/formats/realtime-ws" }
respan-gateway-mcp-http = { path = "crates/formats/mcp-http" }
respan-gateway-passthrough-http = { path = "crates/formats/passthrough-http" }
respan-gateway-vendor-kit = { path = "crates/vendor-kit" }
respan-gateway-vendors = { path = "crates/vendors" }
respan-gateway-serve = { path = "crates/serve" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
base64 = "0.22"
form_urlencoded = "1"
futures = "0.3"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
memchr = "2"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8.23", features = ["preserve_order"] }
tokio = "1"
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
