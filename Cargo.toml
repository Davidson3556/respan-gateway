[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-core = { path = "crates/core" }
respan-gateway-formats = { path = "crates/formats" }
respan-gateway-sdk = { path = "crates/sdk" }
respan-gateway-server = { path = "crates/server" }
respan-gateway-store = { path = "crates/store" }
respan-gateway-testkit = { path = "crates/testkit" }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
