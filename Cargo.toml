[workspace]
members = ["crates/*", "sdks/*", "examples"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-core = { path = "crates/core" }
respan-gateway-formats = { path = "crates/formats" }
respan-gateway-http = { path = "crates/http" }
respan-gateway-plugins = { path = "crates/plugins" }
respan-gateway-server = { path = "crates/server" }
respan-gateway-testkit = { path = "crates/testkit" }
respan-gateway-routing = { path = "sdks/routing" }
respan-gateway-text = { path = "sdks/text" }
respan-gateway-ledger = { path = "sdks/ledger" }
respan-gateway-mcp = { path = "sdks/mcp" }
respan-gateway-ws = { path = "sdks/ws" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
