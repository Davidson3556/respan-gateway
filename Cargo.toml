[workspace]
members = [
    "crates/core",
    "crates/plugins",
    "crates/kinds/*",
    "crates/wires/*",
    "crates/formats/*",
    "crates/providers",
    "crates/serve",
    "apps/gateway",
    "python",
    "examples",
]
exclude = ["validation"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/respanai/respan-gateway"
publish = false

[workspace.dependencies]
respan-gateway-realtime = { path = "crates/kinds/realtime" }
respan-gateway-core = { path = "crates/core" }
respan-gateway-conversation = { path = "crates/kinds/conversation" }
respan-gateway-media = { path = "crates/kinds/media" }
respan-gateway-http = { path = "crates/wires/http" }
respan-gateway-plugins = { path = "crates/plugins" }
respan-gateway-mcp = { path = "crates/kinds/mcp" }
respan-gateway-ws = { path = "crates/wires/ws" }
respan-gateway-conversation-http = { path = "crates/formats/conversation-http" }
respan-gateway-media-http = { path = "crates/formats/media-http" }
respan-gateway-realtime-ws = { path = "crates/formats/realtime-ws" }
respan-gateway-mcp-http = { path = "crates/formats/mcp-http" }
respan-gateway-providers = { path = "crates/providers" }
respan-gateway-serve = { path = "crates/serve" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
base64 = "0.22"
futures = "0.3"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
memchr = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
