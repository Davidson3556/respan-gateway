name: release

# Tag vX.Y.Z to build the binary for each target, with the web UI embedded,
# and attach it (with SHA256SUMS) to a GitHub release, and to publish to
# crates.io every crate whose version is not there yet.
# Nothing is published unless the tag matches the version of respan-gateway
# (apps/gateway/Cargo.toml) and of the Python package, and ci.yml passes.
# (The tag also triggers python.yml, which publishes to PyPI.) Run by hand
# (workflow_dispatch), it is a dry run: everything is built, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the gateway's and the Python package's versions
        run: |
          gateway=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/gateway/Cargo.toml | head -n 1)
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -n 1)
          echo "ref ${GITHUB_REF_NAME}, respan-gateway ${gateway}, Python ${python}"
          test -n "$gateway" && test "$gateway" = "$python"
          if [ "${GITHUB_EVENT_NAME}" = push ]; then test "${GITHUB_REF_NAME}" = "v${gateway}"; fi

  ci:
    uses: ./.github/workflows/ci.yml

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist

  build:
    needs: [ui, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p respan-gateway --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          name=respan-gateway-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/respan-gateway LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "respan-gateway-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/respan-gateway.exe", LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            respan-gateway-*.tar.gz
            respan-gateway-*.zip
          if-no-files-found: error

  publish:
    needs: [build, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum respan-gateway-*.tar.gz respan-gateway-*.zip > SHA256SUMS
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-checksums
          path: SHA256SUMS
      - if: github.event_name == 'push'
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes respan-gateway-*.tar.gz respan-gateway-*.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  # Every crate whose version is not on crates.io yet, in dependency order;
  # respan-gateway carries the web UI in ui-dist/. Needs the CARGO_REGISTRY_TOKEN
  # secret. Run by hand, it packages and builds the crates instead.
  crates:
    needs: [version, ui, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: apps/gateway/ui-dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/publish-crates.py --dry-run
      - if: github.event_name == 'push'
        run: python3 .github/scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
