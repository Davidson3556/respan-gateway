name: release

# Tag vX.Y.Z to build the binary for each target, with the web UI embedded,
# and attach it (with SHA256SUMS) to a GitHub release; also push the Docker
# image to GHCR, assembled from the native Linux binaries (no emulation).
# Nothing is published unless the tag matches Cargo.toml and ci.yml passes.
# (The tag also triggers python.yml, which publishes to PyPI.) Run by hand
# (workflow_dispatch), it is a dry run: everything is built, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          cargo_version=$(awk '/^\[workspace.package\]/{w=1;next} /^\[/{w=0} w && /^version *=/{gsub(/[" ]/,"",$0); sub(/version=/,"",$0); print; exit}' Cargo.toml)
          echo "ref ${GITHUB_REF_NAME}, Cargo.toml ${cargo_version}"
          test -n "$cargo_version"
          if [ "${GITHUB_EVENT_NAME}" = push ]; then test "${GITHUB_REF_NAME}" = "v${cargo_version}"; fi

  ci:
    uses: ./.github/workflows/ci.yml

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist

  build:
    needs: [ui, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p respan-gateway --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          name=respan-gateway-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/respan-gateway LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "respan-gateway-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/respan-gateway.exe", LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            respan-gateway-*.tar.gz
            respan-gateway-*.zip
          if-no-files-found: error

  publish:
    needs: [build, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum respan-gateway-*.tar.gz respan-gateway-*.zip > SHA256SUMS
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-checksums
          path: SHA256SUMS
      - if: github.event_name == 'push'
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes respan-gateway-*.tar.gz respan-gateway-*.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  # One image per architecture, from the binary built natively above, pushed
  # by digest; `image` then merges them into one multi-arch manifest.
  image-arch:
    needs: [build, ci]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: archive
      - name: Unpack the binary
        run: |
          mkdir -p docker-bin/${{ matrix.arch }}
          tar xzf archive/*.tar.gz -C archive
          cp archive/respan-gateway-*/respan-gateway docker-bin/${{ matrix.arch }}/
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
      - if: github.event_name == 'workflow_dispatch'
        name: The image runs
        run: |
          docker buildx build --load --target prebuilt --platform linux/${{ matrix.arch }} -t gateway-dry-run .
          docker run --rm gateway-dry-run --version
      - if: github.event_name == 'push'
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  image:
    needs: image-arch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Merge the per-architecture images
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
