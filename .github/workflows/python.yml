name: python

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["python/**", "apps/gateway/**", "crates/**", "Cargo.*", "apps/ui/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "apps/gateway/**", "crates/**", "Cargo.*", "apps/ui/**", ".github/workflows/python.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The web UI is embedded in the binary by apps/gateway/build.rs when
  # apps/ui/dist exists, so wheels and test builds need it built first.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist

  # A v* tag publishes to PyPI only if the repository's CI passes too.
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  test:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv && .venv/bin/pip install maturin
      - run: .venv/bin/maturin develop --extras test
      - run: .venv/bin/pytest
      - run: .venv/bin/mypy --strict python/respan_gateway
        if: matrix.python == '3.13'

  wheels:
    needs: ui
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
      # One abi3 wheel per platform serves every Python from 3.9.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl
      # The wheel itself must import and run, not just build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv /tmp/wheel-venv
          . /tmp/wheel-venv/bin/activate 2>/dev/null || . /tmp/wheel-venv/Scripts/activate
          pip install pytest openai anthropic
          pip install --find-links python/dist respan-gateway
          cd python && pytest tests

  # The sdist carries no built UI (apps/ui/dist is untracked): building from
  # it embeds the placeholder page. Wheels have the real UI.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # On a v* tag: upload the wheels and sdist to PyPI by trusted publishing
  # (no token; the PyPI project must trust this repository and workflow, see
  # CONTRIBUTING.md#releasing).
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wheels, sdist, ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
