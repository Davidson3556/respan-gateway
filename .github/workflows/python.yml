name: python

on:
  push:
    branches: [main]
    paths: ["python/**", "apps/gateway/**", "crates/**", "Cargo.*", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "apps/gateway/**", "crates/**", "Cargo.*", ".github/workflows/python.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv && .venv/bin/pip install maturin
      - run: .venv/bin/maturin develop --extras test
      - run: .venv/bin/pytest
      - run: .venv/bin/mypy --strict python/respan_gateway
        if: matrix.python == '3.13'

  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # One abi3 wheel per platform serves every Python from 3.9.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz
