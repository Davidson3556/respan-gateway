[package]
name = "respan-gateway-plugins"
description = "First-party model routing policy built on public core and SDK APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-sdk.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }

[dev-dependencies]
respan-gateway-http = { workspace = true, features = ["reqwest"] }
respan-gateway-providers.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
