[package]
name = "respan-gateway-realtime"
description = "Client and provider event models for realtime sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ws"]
# The kind's wire: a WebSocket session of JSON events ([`JsonEvents`]).
ws = ["dep:respan-gateway-ws", "dep:respan-gateway-http"]

[dependencies]
respan-gateway-ws = { workspace = true, optional = true }
respan-gateway-http = { workspace = true, optional = true }
respan-gateway-core.workspace = true
serde_json.workspace = true
