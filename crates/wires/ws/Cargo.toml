[package]
name = "respan-gateway-ws"
description = "WebSocket sessions at both gateway edges, and a JSON events format."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
respan-gateway-plugin-relay = { path = "../../plugins/relay" }
respan-gateway-serve = { path = "../../serve" }
http.workspace = true
respan-gateway-realtime-ws = { path = "../../formats/realtime-ws" }
respan-gateway-http.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
bytes.workspace = true
futures.workspace = true
