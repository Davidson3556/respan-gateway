[package]
name = "respan-gateway-plugin-routing"
description = "First-party plugin: route each request by its model to providers picked by order, price, speed or weight, with fallback and hedging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wildmatch.workspace = true
parking_lot.workspace = true
respan-gateway-core.workspace = true
respan-gateway-sdk.workspace = true
respan-gateway-plugin-fallback.workspace = true
getrandom = { workspace = true, features = ["std"] }

[dev-dependencies]
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
respan-gateway-passthrough-http.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
