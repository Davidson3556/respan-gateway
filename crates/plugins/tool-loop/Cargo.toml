[package]
name = "respan-gateway-plugin-tool-loop"
description = "First-party plugin: the gateway runs tools inside a chat request."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-http-faults.workspace = true
respan-gateway-core.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-http.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }

[dev-dependencies]
respan-gateway-conversation-http.workspace = true
respan-gateway-http.workspace = true
respan-gateway-http-transport.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
