[package]
name = "respan-gateway-axum"
description = "Axum HTTP ingress for the gateway, with optional WebSocket hosting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
ws = ["dep:respan-gateway-ws", "dep:hyper", "dep:hyper-util"]

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-ws = { workspace = true, optional = true }
axum.workspace = true
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util.workspace = true

[dev-dependencies]
http.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-chat.workspace = true
respan-gateway-http = { workspace = true, features = ["reqwest"] }
respan-gateway-core.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
tower = { version = "0.5", features = ["util"] }
bytes.workspace = true
futures.workspace = true
serde_json.workspace = true
async-trait.workspace = true
