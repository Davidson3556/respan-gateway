[package]
name = "respan-gateway-chat"
description = "Chat formats over HTTP for respan-gateway: OpenAI Chat Completions (with vendor dialects) and Anthropic Messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["openai", "anthropic"]
# OpenAI Chat Completions and its vendor dialects.
openai = []
# Anthropic Messages.
anthropic = []

[dependencies]
base64.workspace = true
respan-gateway-conversation.workspace = true
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
mockllm = { git = "https://github.com/lihe07/mockllm", rev = "4d4b194" }
respan-gateway-http = { workspace = true, features = ["reqwest"] }
respan-gateway-plugins.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }

# The suites relay and translate both formats.
[[test]]
name = "relay"
required-features = ["openai", "anthropic"]

[[test]]
name = "round_trips"
required-features = ["openai", "anthropic"]

[[test]]
name = "translate"
required-features = ["openai", "anthropic"]

[[bench]]
name = "relay"
required-features = ["openai", "anthropic"]
