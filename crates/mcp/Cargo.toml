[package]
name = "respan-gateway-mcp"
description = "MCP streamable-HTTP format and stdio transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-mcp-messages.workspace = true
respan-gateway-sdk.workspace = true
serde_json.workspace = true
getrandom = { workspace = true, features = ["std"] }
respan-gateway-http.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
respan-gateway-http = { workspace = true, features = ["reqwest"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "test-util"] }
