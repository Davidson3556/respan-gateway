[package]
name = "respan-gateway-tool-vendor-kit"
description = "A tool vendor as a template: an HTTP API's tools, its key and its base URL; and an MCP server of it, in process."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-mcp.workspace = true
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["json", "query"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
