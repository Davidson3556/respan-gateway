[package]
name = "respan-gateway-mcp-http"
description = "MCP over HTTP: the streamable-HTTP format, and a stdio server as a transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = { workspace = true, features = ["std"] }
respan-gateway-core.workspace = true
respan-gateway-http.workspace = true
respan-gateway-mcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
respan-gateway-http = { workspace = true, features = ["reqwest"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "test-util"] }

# Signals a stdio server's process group, which tokio cannot.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
