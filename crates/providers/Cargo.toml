[package]
name = "respan-gateway-providers"
description = "The vendors: where each is, how it takes a key, its models, the formats it speaks, and its quirks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
respan-gateway-conversation.workspace = true
respan-gateway-conversation-http.workspace = true
respan-gateway-core.workspace = true
respan-gateway-media-http.workspace = true
respan-gateway-realtime.workspace = true
respan-gateway-realtime-ws.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
respan-gateway-http.workspace = true
respan-gateway-ws = { workspace = true, features = ["axum"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
