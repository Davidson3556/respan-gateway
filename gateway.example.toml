# Respan Gateway example. Copy to gateway.toml and run `respan-gateway`.
# Needs OPENAI_API_KEY, ANTHROPIC_API_KEY and LINKUP_API_KEY.
# All settings: docs/configuration.md

listen = "127.0.0.1:8080"
# client_keys = [{ name = "app", key = "env:APP_KEY" }]   # required beyond localhost


[providers.openai]
vendor = "openai"
key    = "env:OPENAI_API_KEY"

[providers.anthropic]
vendor = "anthropic"
key    = "env:ANTHROPIC_API_KEY"


# Clients ask for "smart": Claude first, then GPT.
[routes.smart]
to    = ["anthropic/claude-haiku-5-5", "openai/gpt-6-luna"]
tries = 2


# An MCP server, run as a command.
[tools.files]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# Linkup's search API, as MCP tools.
[tools.search]
vendor = "linkup"

# Every server at /mcp, tools named server__tool.
[plugins.mcp_aggregate]

# Any chat model can use the tools; the gateway runs the calls.
[plugins.tool_loop]
deny = ["files__write*"]


# [plugins.respan]                     # a trace per request in Respan
# key = "env:RESPAN_API_KEY"
