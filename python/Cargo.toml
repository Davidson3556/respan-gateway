[package]
name = "respan-gateway-python"
description = "Python bindings for respan-gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# A test executable cannot link the extension without libpython; the Python
# tests in `tests/` cover it.
test = false
doctest = false

[features]
# Enabled by maturin (pyproject.toml) so the workspace still links under
# `cargo test` and `cargo clippy`.
extension-module = ["pyo3/extension-module"]

[dependencies]
respan-gateway = { path = "../apps/gateway" }
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
serde_norway.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
# PyO3's macros expand to unsafe code.
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
